---
version: "2"

run:
  timeout: 1m

linters:
  default: all
  disable:
    - wrapcheck
    - testpackage
    - gochecknoglobals
    - exhaustruct
    - paralleltest
    - godox
    - cyclop
    - tagliatelle
    - err113 # renamed from goerr113
    - varnamelen
    - errorlint
    - forcetypeassert
    - perfsprint
    - depguard
    - testifylint
    # Deprecated (since golangci-lint v2.2.0); replaced by wsl_v5, which is
    # enabled via `default: all`.
    - wsl
  settings:
    funlen:
      lines: 150
      statements: 45
  exclusions:
    paths:
      - internal/.*
    rules:
      - path: cmd/
        linters:
          - gochecknoinits
          - mnd # renamed from gomnd
          - forbidigo
          - lll
      - path: example_test.go
        linters:
          - lll
          - dupword
      - path: internal/http/
        linters:
          - unparam
          - nlreturn
      - path: _test\.go
        linters:
          - wsl_v5 # same relaxation the old `wsl` had for tests
          - nlreturn
          - funlen
          - dupl
          - gocognit
          - lll
          - gosmopolitan # i18n test fixtures legitimately contain non-Latin text
      - path: doc.go
        linters:
          - lll
      - source: "json:"
        linters:
          - lll
      - source: "Err"
        linters:
          - lll
      - source: "//////"
        linters:
          - gocritic
          - godot

formatters:
  enable:
    - gofmt
    - goimports
